name: render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scene:
        description: which film to render
        type: choice
        options: [all, dusk, moon, snow, dawn]
        default: all
      chunks:
        description: parallel jobs per film (1710 frames each)
        default: "8"
      width:
        default: "1920"
      height:
        default: "1080"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # every push: build, publish the live page, and capture stills of every film as a smoke test
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: capture stills (title, duel, looking up) for each film
        run: |
          for s in dusk moon snow dawn; do
            for f in 150 1020 1380; do node scripts/render.mjs --scene $s --start $f --end $f --out stills/$s; done
          done
          find stills -name '*.png' | sort
      - uses: actions/upload-artifact@v4
        with: { name: stills, path: stills/ }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.m.outputs.frames }}
      scenes: ${{ steps.m.outputs.scenes }}
    steps:
      - id: m
        run: |
          python3 - "${{ inputs.scene }}" "${{ inputs.chunks }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          scenes = ["dusk", "moon", "snow", "dawn"] if sys.argv[1] == "all" else [sys.argv[1]]
          n = int(sys.argv[2]); total = 1710; per = -(-total // n)
          frames = [{"scene": s, "start": a, "end": min(total - 1, a + per - 1)} for s in scenes for a in range(0, total, per)]
          print("frames=" + json.dumps({"include": frames}))
          print("scenes=" + json.dumps(scenes))
          PY

  frames:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/render.mjs --scene ${{ matrix.scene }} --start ${{ matrix.start }} --end ${{ matrix.end }} --out frames --width ${{ inputs.width }} --height ${{ inputs.height }}
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.scene }}-${{ matrix.start }}
          path: frames/
          compression-level: 0

  stitch:
    needs: [plan, frames]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.scenes) }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-${{ matrix.scene }}-*", path: all, merge-multiple: true }
      - name: stitch with ffmpeg
        run: |
          case "${{ matrix.scene }}" in
            dusk) name=cherry_blossoms ;; moon) name=moonlight ;; snow) name=winter_plum ;; dawn) name=first_light ;;
          esac
          n=$(ls all | wc -l); echo "$n frames"; test "$n" -eq 1710
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out
          ffmpeg -y -framerate 30 -i all/f%05d.png -c:v libx264 -pix_fmt yuv420p -crf 17 -preset slow -movflags +faststart out/$name.mp4
          ffmpeg -y -i out/$name.mp4 -vf "select='not(mod(n\,171))',scale=640:-1,tile=5x2" -frames:v 1 out/${name}_contact_sheet.png
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ matrix.scene }}
          path: out/
          compression-level: 0

  release:
    needs: stitch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: film-*, path: out, merge-multiple: true }
      - name: attach every film to one release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la out
          tag="run-${{ github.run_number }}"
          gh release create "$tag" out/* --title "Cherry Blossoms films $tag" \
            --notes "Scene(s): ${{ inputs.scene }}. 57 s each, 30 fps, ${{ inputs.width }}x${{ inputs.height }}, rendered on GitHub Actions in ${{ inputs.chunks }} chunks per film. dusk = cherry_blossoms, moon = moonlight, snow = winter_plum, dawn = first_light."
